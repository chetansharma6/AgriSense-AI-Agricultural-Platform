name: Release verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match Render's Python version in render.yaml.
          python-version: "3.11.17"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: timeout 120s python -m pip install --disable-pip-version-check --no-input -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: timeout 180s python -m pytest -q
      - name: Evaluate offline demo fixtures
        working-directory: backend
        # The evaluator replaces every provider call with a failing mock.
        run: timeout 30s python -m scripts.evaluate_demos

  frontend:
    name: Frontend release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: timeout 180s npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: timeout 60s npm test
      - name: Lint frontend
        working-directory: frontend
        run: timeout 60s npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: timeout 60s npx next typegen && timeout 60s npx tsc --noEmit
      - name: Build frontend
        working-directory: frontend
        run: timeout 180s npm run build
